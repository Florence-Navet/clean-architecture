# Kafka seul (mode KRaft, un seul nœud, sans ZooKeeper) + une interface web pour voir les messages.
# Démarrer : docker compose up -d      Arrêter : docker compose down
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: depenses-kafka
    ports:
      - "9092:9092" # pour nos programmes Node, lancés sur la machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Deux portes d'entrée : localhost:9092 depuis la machine, kafka:19092 depuis les autres conteneurs
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Un seul nœud : pas de copies
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 3s
      timeout: 10s
      retries: 20

  # Crée les topics une fois Kafka prêt, puis s'arrête (c'est normal qu'il soit « Exited »).
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: depenses-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic expenses
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic expenses.dlq

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: depenses-kafka-ui
    ports:
      - "8080:8080" # http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
